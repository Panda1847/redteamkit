[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteamkit"
version = "3.4.0"
description = "Authorized red-team planning and detection-validation engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "RedTeamKit contributors"}]
classifiers = ["Development Status :: 4 - Beta", "Intended Audience :: Information Technology", "License :: Other/Proprietary License", "Programming Language :: Python :: 3"]

[project.scripts]
redteamkit = "redteamkit.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[tool.setuptools]
packages = ["redteamkit"]

[tool.setuptools.package-data]
redteamkit = ["data/*.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
