name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Run complete test suite
        run: python -m unittest discover -v
      - name: Run Ruff
        run: ruff check .
      - name: Run mypy
        run: mypy redteamkit
      - name: Verify offline guard
        run: |
          if redteamkit sync --offline; then
            echo "sync --offline unexpectedly succeeded"
            exit 1
          fi
      - name: Smoke test installed CLI
        run: |
          redteamkit profiles
          redteamkit validate --json
          redteamkit opsec
